<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dora Dora</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #1c1c1c;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 28px;
        }

        .welcome {
            padding: 50px 20px;
            text-align: center;
        }

        .welcome h2 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #aaa;
            font-size: 16px;
        }

        .videos {
            padding: 20px;
        }

        .videos h3 {
            margin-bottom: 15px;
        }

        .empty {
            padding: 30px;
            text-align: center;
            background: #1c1c1c;
            border-radius: 12px;
            color: #888;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 Dora Dora</h1>
    </header>

    <section class="welcome">
        <h2>Welcome to Dora Dora</h2>
        <p>Your entertainment starts here.</p>
    </section>

    <section class="videos">
        <h3>Latest Videos</h3>

        <div class="empty">
            No videos available yet.
        </div>
    </section>

</body>
</html>
